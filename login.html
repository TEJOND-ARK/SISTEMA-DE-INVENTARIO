<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTO-PARTS MARKET - Ingreso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- SDK de Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Vinculación del archivo de configuración de la App para Celular -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center px-4">

    <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-xl w-full max-w-md space-y-6">
        
        <!-- Encabezado / Logo Temporal -->
        <div class="text-center space-y-2">
            <div class="bg-indigo-50 text-indigo-600 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto shadow-sm border border-indigo-100">
                <i data-lucide="wrench" class="w-7 h-7"></i>
            </div>
            <h2 class="text-xl font-black text-slate-900 tracking-tight uppercase">Auto-Parts Market</h2>
            <p class="text-xs text-slate-400 font-medium">Introduce tus credenciales para acceder al inventario</p>
        </div>

        <!-- Formulario de Acceso -->
        <form onsubmit="manejarLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Correo Electrónico:</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input type="email" id="loginEmail" required placeholder="tu_usuario@correo.com" class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wide">Contraseña:</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition shadow-md shadow-indigo-100">
                <i data-lucide="log-in" class="w-4 h-4"></i> Entrar al Sistema
            </button>
        </form>

        <!-- Botón de instalación nativa (Solo aparece si el teléfono es compatible) -->
        <div id="contenedor-instalar-app" class="hidden border-t border-slate-100 pt-4 text-center">
            <button onclick="instalarAplicacionNativa()" class="inline-flex items-center gap-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold py-2 px-4 rounded-xl border border-emerald-200 transition">
                <i data-lucide="download" class="w-4 h-4"></i> Instalar como Aplicación móvil
            </button>
        </div>
    </div>

    <script>
        // Configuración de tu misma Base de Datos de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBJKdcy6awuDMuBDOlhGiNLRYqjTzPdx_E",
            authDomain: "web-anonima-d7b3c.firebaseapp.com",
            projectId: "web-anonima-d7b3c",
            storageBucket: "web-anonima-d7b3c.firebasestorage.app",
            messagingSenderId: "212970847778",
            appId: "1:212970847778:web:4d9783171719912dc9147b",
            measurementId: "G-SGL2WSXBN2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Evitar clic derecho
        document.addEventListener('contextmenu', e => e.preventDefault());
        try { lucide.createIcons(); } catch(e){}

        // Verificar si ya está logueado para mandarlo directo al inventario
        auth.onAuthStateChanged((user) => {
            if (user) { window.location.href = "index.html"; }
        });

        // Función para procesar el inicio de sesión
        function manejarLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPassword").value.trim();

            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de Acceso',
                        text: 'El correo o la contraseña son incorrectos.',
                        confirmButtonColor: '#4f46e5'
                    });
                });
        }

        // ========================================================
        // LÓGICA DE INSTALACIÓN EN CELULARES (COMPATIBILIDAD APP)
        // ========================================================
        let eventoInstalacion = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            eventoInstalacion = e;
            // Mostrar el botón de instalación en pantalla
            document.getElementById('contenedor-instalar-app').classList.remove('hidden');
        });

        function instalarAplicacionNativa() {
            if (eventoInstalacion) {
                eventoInstalacion.prompt();
                eventoInstalacion.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('contenedor-instalar-app').classList.add('hidden');
                    }
                    eventoInstalacion = null;
                });
            }
        }
    </script>
</body>
</html>
